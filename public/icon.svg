<?xml version="1.0" encoding="UTF-8"?>
<!--
  お友達図鑑 アプリアイコン (chara-collection)
  パステル配色・角丸のポップな図鑑＋ハートのモチーフ。
  maskable 対応のため、主要な絵柄は中央 80% のセーフゾーン内に収めている。
  カラーはデザイントークンに一致: primary #ffb6c8 / accent #d9c8f5 / mint #b8ecd0 / cream #fff8f0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="お友達図鑑">
  <!-- 背景（maskable 用に全面を塗る。角丸はマスク側で処理されるため塗りは全面） -->
  <rect x="0" y="0" width="512" height="512" fill="#ffb6c8" />

  <!-- セーフゾーン (中央 80% = 51.2〜460.8) 内に主要モチーフを配置 -->
  <!-- 図鑑（本）: クリーム地の角丸カード -->
  <g>
    <!-- 本の背面（ラベンダー） -->
    <rect x="118" y="150" width="276" height="228" rx="28" fill="#d9c8f5" />
    <!-- 本の表紙（クリーム） -->
    <rect x="132" y="136" width="248" height="228" rx="26" fill="#fff8f0" />
    <!-- 中央の綴じ線 -->
    <rect x="252" y="146" width="8" height="208" rx="4" fill="#f0e4d8" />

    <!-- ハート（ミント）左ページ側 -->
    <path d="M198 214
             c-18 -20 -52 -8 -52 20
             c0 26 34 44 52 60
             c18 -16 52 -34 52 -60
             c0 -28 -34 -40 -52 -20 z"
          fill="#b8ecd0" />
    <!-- ハート（ピンク）右ページ側 -->
    <path d="M314 240
             c-14 -16 -42 -6 -42 16
             c0 21 28 36 42 48
             c14 -12 42 -27 42 -48
             c0 -22 -28 -32 -42 -16 z"
          fill="#ffb6c8" />
  </g>
</svg>
